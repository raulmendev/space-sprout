<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jardín Comunal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1d1b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- The loading screen until Angular starts; keep in step with LoadingScreenComponent. -->
  <app-root>
    <div class="boot" role="status" aria-label="Loading the station">
      <div class="boot-stars" aria-hidden="true"></div>
      <div class="boot-earth" aria-hidden="true"></div>
      <div class="boot-body">
        <img class="boot-station" src="assets/loading/station.webp" alt="" width="384" height="157">
        <p class="boot-title">Jardín Comunal</p>
        <div class="boot-bar waiting" aria-hidden="true"><div class="boot-fill"></div></div>
        <p class="boot-text">Docking at the station…</p>
      </div>
    </div>
  </app-root>
</body>
</html>
