<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Space Sprout</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1d1b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/brand/icon-192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- The loading screen until Angular starts; keep in step with LoadingScreenComponent. -->
  <app-root>
    <div class="boot" role="status" aria-label="Loading the station">
      <div class="boot-stars" aria-hidden="true"></div>
      <div class="boot-earth" aria-hidden="true"></div>
      <div class="boot-body">
        <div class="boot-station" aria-hidden="true">
          <img src="assets/loading/station.webp" alt="" width="384" height="157">
          <span class="boot-shine"></span><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <p class="boot-title">Space Sprout</p>
        <div class="boot-bar waiting" aria-hidden="true"><div class="boot-fill"></div></div>
        <p class="boot-text">Docking at the station…</p>
      </div>
    </div>
  </app-root>
  <!-- Spanish before Angular starts: mirrors initialLang() in i18n.ts (saved choice, else the device). -->
  <script>
    (function () {
      var lang = null;
      try { lang = JSON.parse(localStorage.getItem('space-sprout:lang')); } catch (e) {}
      if (lang !== 'en' && lang !== 'es') lang = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
      document.documentElement.lang = lang;
      if (lang !== 'es') return;
      var boot = document.querySelector('app-root .boot');
      if (boot) boot.setAttribute('aria-label', 'Cargando la estación');
      var text = document.querySelector('app-root .boot-text');
      if (text) text.textContent = 'Acoplando a la estación…';
    })();
  </script>
</body>
</html>
